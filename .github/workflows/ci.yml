name: CI

# GitHub Actions 部分 YAML 解析器会把裸 `on` 当作布尔值，
# 加引号保证在任何严格 YAML 解析器下都按字符串键解析。
"on":
  push:
  pull_request:

jobs:
  ci:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy --workspace -- -D warnings
        run: cargo clippy --workspace -- -D warnings

      # Release 编译验证：release 模式是生产形态，与 debug 测试路径不同，
      # 三平台统一编译一次确保无 release-only 编译错误。
      # 依赖产物写入 target/release，runner 上无需提交，本地验证时由 .gitignore 忽略。
      - name: cargo build --release --workspace
        run: cargo build --release --workspace

      - name: cargo test --workspace
        run: cargo test --workspace

      # 特性测试：crates/algeff-core/tests/runtime_features.rs 的 7 个测试
      # 由 coeffects/virtual-clock 特性门控，默认测试不含，此处三平台补跑。
      - name: cargo test --workspace --features coeffects,virtual-clock
        run: cargo test --workspace --features coeffects,virtual-clock

      # mdBook 构建：仅当 docs/book.toml 存在时执行。
      # 选 cargo install --locked 而非下载 release 二进制：
      # 同一命令跨 ubuntu/windows 矩阵，无需维护各平台二进制 URL，
      # --locked 固定依赖版本，保证可复现构建。
      # mdbook 二进制做 actions/cache 缓存，命中缓存时跳过 cargo install，
      # 避免每次 push 都重新编译 mdbook（约 1-2 分钟）。
      - name: Cache mdbook
        if: hashFiles('docs/book.toml') != ''
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/mdbook
          key: mdbook-${{ runner.os }}-stable

      - name: Install mdbook
        if: hashFiles('docs/book.toml') != '' && steps.cache.outputs.cache-hit != 'true'
        run: cargo install mdbook --locked

      - name: Build mdBook docs
        if: hashFiles('docs/book.toml') != ''
        working-directory: docs
        run: mdbook build
        shell: bash
