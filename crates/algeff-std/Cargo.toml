[package]
name = "algeff-std"
version.workspace = true
edition.workspace = true
description = "Algeff 标准适配层：tokio 物理后端（DataOp 执行器 + 预包装适配器）"

[dependencies]
algeff-core = { path = "../algeff-core" }
tokio.workspace = true

[dev-dependencies]
tempfile.workspace = true
criterion.workspace = true
proptest.workspace = true

# A7: criterion 基准（harness=false → bench 自带 criterion main）。见 benches/*.rs
[[bench]]
name = "echo"
harness = false

[[bench]]
name = "parallel_reads"
harness = false

[[bench]]
name = "shared_read"
harness = false

[[bench]]
name = "append"
harness = false
