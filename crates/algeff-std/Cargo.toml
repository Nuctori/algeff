[package]
name = "algeff-std"
version.workspace = true
edition.workspace = true
description = "Algeff 标准适配层：tokio 物理后端（DataOp 执行器 + 预包装适配器）"

[dependencies]
algeff-core = { path = "../algeff-core", version = "0.1.0" }
tokio.workspace = true

[dev-dependencies]
tempfile.workspace = true
criterion.workspace = true
proptest.workspace = true
algeff-macro = { path = "../algeff-macro" }

# A7: criterion 基准（harness=false → bench 自带 criterion main）。见 benches/*.rs
[[bench]]
name = "echo"
harness = false

[[bench]]
name = "parallel_reads"
harness = false

[[bench]]
name = "shared_read"
harness = false

[[bench]]
name = "append"
harness = false

# A7 批 3（G3 Algeff 对比列）：Runtime::new(TokioExecutor) + interpret 驱动同一场景
[[bench]]
name = "algeff_echo"
harness = false

[[bench]]
name = "algeff_parallel_reads"
harness = false

[[bench]]
name = "algeff_shared_read"
harness = false

[[bench]]
name = "algeff_append"
harness = false
