[package]
name = "algeff-macro"
version.workspace = true
edition.workspace = true
description = "Algeff 可选语法糖宏（plan!/fork!/scope!/choose!），仅 AST 构造，不参与类型系统"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[dev-dependencies]
algeff-core = { path = "../algeff-core" }
